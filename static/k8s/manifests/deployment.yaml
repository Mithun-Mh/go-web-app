
apiVersion: apps/v1
kind: Deployment

metadata:
  name: go-web-deployment
  labels:
    app: go-web-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: go-web-app

  template:
    metadata:
      labels:
        app: go-web-app

    spec:
      containers:
        - name: go-web-container
          image: mithunmh19/go-web-app:v1
          ports:
            - containerPort: 8080
